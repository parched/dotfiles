        allowPrerelease: true
        securityContext: current
      settings:
        id: "tummychow.git-absorb"
        source: winget
      id: tummychow.git-absorb
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Installing GitHub.cli
        allowPrerelease: true
        securityContext: current
