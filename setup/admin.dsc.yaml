# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Machine-wide settings that need an administrator. winget doesn't reliably
# honour `securityContext: elevated`, so run_onchange_after_winget.ps1 runs this
# whole file elevated instead.

properties:
  resources:
    ### Settings ###
    - resource: Microsoft.Windows.Developer/DeveloperMode
      directives:
        description: Enable Developer Mode
        allowPrerelease: true
      settings:
        Ensure: Present
    - resource: Microsoft.Windows.Developer/UserAccessControl
      id: UserAccessControl
      directives:
        allowPrerelease: true
        description: Configure User Access Control
      settings:
        AdminConsentPromptBehavior: "RequireConsentOnSecureDesktop"

    ### Visual Studio ###
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Installing Microsoft.VisualStudio.Professional
        allowPrerelease: true
      settings:
        id: "Microsoft.VisualStudio.Professional"
        source: winget
      id: Microsoft.VisualStudio.Professional
    - resource: Microsoft.VisualStudio.DSC/VSComponents
      dependsOn:
        - Microsoft.VisualStudio.Professional
      directives:
        description: Install required VS workloads from vsconfig file
        allowPrerelease: true
      settings:
        productId: Microsoft.VisualStudio.Product.Professional
        channelId: VisualStudio.18.Release
        vsConfigFile: "${WinGetConfigRoot}/.vsconfig"

  configurationVersion: 0.2.0
